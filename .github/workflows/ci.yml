name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test must fail fast, not burn GitHub's 6-hour job limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build/runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install "cloudpickle>=3.0" "pytest>=7.0"

      - name: Configure (CMake)
        run: >
          cmake -S . -B build-release
          -DCMAKE_BUILD_TYPE=Release
          -DVEGA_BUILD_SERVER=ON

      - name: Build
        run: cmake --build build-release -j 4

      - name: C++ tests (ctest)
        working-directory: build-release
        # Per-test limit: a hang fails in minutes and names the stuck test.
        run: ctest --output-on-failure --timeout 180

      - name: PyVega Python tests
        env:
          VEGA_SERVER: ${{ github.workspace }}/build-release/vega_server
          PYTHONPATH: ${{ github.workspace }}/python
        run: python -m pytest python/tests -q

  wheel:
    # Builds the package exactly as PyPI users get it (scikit-build-core +
    # the in-process server extension) and runs the Python suite with no
    # standalone vega_server binary available.
    name: pip install . (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # actions/setup-python has no CPython 3.9 for newer runner images
          # (ubuntu-latest is 26.04); test the oldest supported version on an
          # image that still provides it.
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
          pip install dist/*.whl "pytest>=7.0"
      - name: Test installed package
        run: |
          cp -r python/tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -m pytest tests -q

  pyspark-compat:
    name: PySpark RDD compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "cloudpickle>=3.0" "pytest>=7.0"

      - name: Configure & build vega_server
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DVEGA_BUILD_SERVER=ON
          cmake --build build-release --target vega_server -j 4

      - name: Fetch Spark test sources
        run: ./scripts/fetch_spark_tests.sh

      - name: Run PySpark RDD compatibility suite
        env:
          VEGA_SERVER: ${{ github.workspace }}/build-release/vega_server
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          # The runner exits non-zero whenever any upstream test fails,
          # including the known JVM-only ones; the gate below decides.
          python scripts/run_pyspark_tests.py --filter pyspark.tests.test_rdd || true

      - name: Check results against known JVM-only failures
        run: python scripts/check_pyspark_report.py

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyspark-compat-report
          path: test-results/pyspark_vs_pyvega.json
