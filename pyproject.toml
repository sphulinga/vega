[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvega"
version = "0.5.0"
description = "Python client for the Vega C++ distributed data processing engine"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "The Vega Authors"}]
keywords = ["distributed", "rdd", "spark", "data-processing", "actors"]
dependencies = ["cloudpickle>=3.0"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/sphulinga/vega"
Documentation = "https://github.com/sphulinga/vega/tree/main/docs"
Repository = "https://github.com/sphulinga/vega"
Issues = "https://github.com/sphulinga/vega/issues"

[project.scripts]
vega-server = "pyvega._server_cli:main"
