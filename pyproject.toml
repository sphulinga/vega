[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13,<3"]
build-backend = "scikit_build_core.build"

[project]
name = "pyvega"
dynamic = ["version"]
description = "Spark-compatible RDD engine: a C++ actor-based runtime with a PySpark-style Python API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "The Vega Authors"}]
keywords = ["distributed", "rdd", "spark", "pyspark", "data-processing", "actors"]
dependencies = ["cloudpickle>=3.0"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/sphulinga/vega"
Documentation = "https://github.com/sphulinga/vega/tree/main/docs"
Repository = "https://github.com/sphulinga/vega"
Issues = "https://github.com/sphulinga/vega/issues"
Changelog = "https://github.com/sphulinga/vega/blob/main/CHANGELOG.md"

[project.scripts]
vega-server = "pyvega._server_cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.16"
cmake.build-type = "Release"
wheel.packages = ["python/pyvega"]
# The version lives in exactly one place: python/pyvega/__init__.py.
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "python/pyvega/__init__.py"
sdist.exclude = [
    ".github",
    "build*",
    "third_party",
    "test-results",
    ".venv",
    "benchmarks/*.scala",
]

[tool.scikit-build.cmake.define]
VEGA_BUILD_PYMODULE = "ON"
VEGA_BUILD_SERVER = "OFF"
VEGA_BUILD_TESTS = "OFF"
VEGA_BUILD_EXAMPLES = "OFF"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_i686 *-manylinux_i686 *-win*"
test-requires = ["pytest>=7.0"]
# Smoke-test every wheel against the in-process server it ships.
test-command = "pytest {project}/python/tests -q -x"
build-verbosity = 1

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.pytest.ini_options]
testpaths = ["python/tests"]
